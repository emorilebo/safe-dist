name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DSAFE_DIST_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S . -B build -DSAFE_DIST_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake --build build
          ctest --test-dir build --output-on-failure

  conan:
    name: Conan package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force
      - name: conan create (builds and runs test_package)
        run: conan create . --build=missing

  dogfood:
    name: Scan this repository with safe-dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The action passes on a clean tree
        uses: ./
        with:
          path: .
      - name: Plant debris and a secret
        run: |
          mkdir -p "$RUNNER_TEMP/dirty/assets"
          touch "$RUNNER_TEMP/dirty/.DS_Store" "$RUNNER_TEMP/dirty/assets/app.js.bak"
          echo "TOKEN=nope" > "$RUNNER_TEMP/dirty/.env"
      - name: The action fails on a dirty tree
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          path: ${{ runner.temp }}/dirty
          json-report: ${{ runner.temp }}/report.json
      - name: Assert the dirty scan failed with three findings
        run: |
          test "${{ steps.dirty.outcome }}" = "failure"
          grep -q '"error_count": 3' "$RUNNER_TEMP/report.json"
