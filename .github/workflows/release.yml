name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
            cmake_args: -DCMAKE_EXE_LINKER_FLAGS=-static
          - target: linux-arm64
            os: ubuntu-24.04-arm
            cmake_args: -DCMAKE_EXE_LINKER_FLAGS=-static
          - target: macos-universal
            os: macos-latest
            # Quoted so bash does not treat ';' as a command separator.
            cmake_args: "'-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15"
          - target: windows-x86_64
            os: windows-latest
            cmake_args: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSAFE_DIST_BUILD_TESTS=ON ${{ matrix.cmake_args }}
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
          cmake --install build --config Release --prefix stage
      - name: Package
        shell: bash
        run: |
          name="safe-dist-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "package/$name" out
          cp stage/bin/* LICENSE README.md "package/$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd package && 7z a "../out/$name.zip" "$name" > /dev/null)
          else
            tar -C package -czf "out/$name.tar.gz" "$name"
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -l
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
